name: Surveiller la légalité shiny et les distributions

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: shinydex-source-monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    name: Contrôler les sources
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comparer les sources
        id: monitor
        run: node tools/monitor-live-data.mjs

      - name: Créer ou compléter l’alerte
        if: steps.monitor.outputs.alert == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "Surveillance Shinydex : sources à vérifier";
            const body = fs.readFileSync(".monitor-report.md", "utf8");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Mémoriser les nouvelles empreintes
        run: |
          if git diff --quiet -- data/source-monitor-state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-monitor-state.json
          git commit -m "Actualiser l’état de surveillance des sources"
          git push
