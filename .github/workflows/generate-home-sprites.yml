name: Générer les sprites HOME 3D

on:
  push:
    branches:
      - agent/sprites-3d

permissions:
  contents: write

jobs:
  generate-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update-data
      - name: Publier les ressources générées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/pokedex-data.js assets/ditto-2d.webp assets/ditto-3d.webp assets/sprites-home-normal-0.webp assets/sprites-home-normal-1.webp assets/sprites-home-normal-2.webp assets/sprites-home-normal-3.webp assets/sprites-home-normal-4.webp assets/sprites-home-normal-5.webp assets/sprites-home-normal-6.webp assets/sprites-home-shiny-0.webp assets/sprites-home-shiny-1.webp assets/sprites-home-shiny-2.webp assets/sprites-home-shiny-3.webp assets/sprites-home-shiny-4.webp assets/sprites-home-shiny-5.webp assets/sprites-home-shiny-6.webp
          git diff --cached --quiet || git commit -m "Générer les planches Pokémon HOME"
          git push
